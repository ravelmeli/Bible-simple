<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Test short 666 - 10 s - v2</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/CormorantGaramond.ttf") format("truetype");
        font-weight: 300 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/CormorantGaramond-Italic.ttf") format("truetype");
        font-weight: 300 700;
        font-style: italic;
      }
      @font-face {
        font-family: "EB Garamond";
        src: url("assets/fonts/EBGaramond.ttf") format("truetype");
        font-weight: 400 800;
        font-style: normal;
      }

      html, body { margin: 0; background: #1a1410; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Cormorant Garamond", Georgia, serif;
        color: #1a1410;
      }

      /* Camera: everything inside moves together for the slow push-in. */
      #camera { position: absolute; inset: 0; }
      #bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: sepia(0.35) saturate(1.15) contrast(1.06) brightness(1.02);
      }
      #paper {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        mix-blend-mode: multiply;
        opacity: 0.55;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 85% 70% at 50% 45%, rgba(26, 20, 16, 0) 55%, rgba(26, 20, 16, 0.6) 100%);
      }

      .mote {
        position: absolute;
        border-radius: 50%;
        background: #f6d77f;
        filter: blur(1px);
      }

      /* Torn parchment card: texture from the blank parchment, jagged edge from a fixed polygon. */
      .card-wrap {
        position: absolute;
        left: 70px;
        width: 940px;
        filter: drop-shadow(0 22px 30px rgba(26, 20, 16, 0.55));
      }
      .card {
        position: relative;
        padding: 64px 70px 70px;
        background: #efe3c8 url("assets/parchemin.jpg") center / 140% auto;
        clip-path: polygon(0% 3%, 6% 0%, 14% 2%, 27% 0%, 41% 2.5%, 55% 0.5%, 68% 2%, 82% 0%, 93% 2%, 100% 0.5%,
          99% 22%, 100% 45%, 98.5% 70%, 100% 97%, 91% 100%, 78% 98%, 63% 100%, 49% 98.5%, 34% 100%, 20% 98%, 7% 100%, 0% 97.5%,
          1% 72%, 0% 48%, 1.5% 24%);
        text-align: center;
      }
      .kicker {
        display: block;
        font-family: "EB Garamond", Georgia, serif;
        font-size: 30px;
        letter-spacing: 9px;
        text-transform: uppercase;
        color: #8b5e34;
        margin-bottom: 18px;
      }
      .rule {
        display: block;
        width: 520px;
        height: 2px;
        margin: 0 auto 26px;
        background: #8b5e34;
        transform-origin: 50% 50%;
      }
      .big {
        margin: 0;
        font-size: 92px;
        font-weight: 600;
        line-height: 1.06;
      }
      .w { display: inline-block; }
      .accent { color: #8b2e1f; font-style: italic; }

      #jean {
        position: absolute;
        left: -30px;
        bottom: -40px;
        height: 1180px;
        width: 607px;
        filter: drop-shadow(18px 26px 26px rgba(26, 20, 16, 0.6)) sepia(0.12);
      }

      #s2-caption {
        position: absolute;
        left: 80px;
        top: 170px;
        width: 920px;
        margin: 0;
        text-align: center;
        font-style: italic;
        font-weight: 500;
        font-size: 66px;
        line-height: 1.15;
        color: #1a1410;
        padding: 30px 40px 34px;
        box-sizing: border-box;
        background: #efe3c8 url("assets/parchemin.jpg") center / 160% auto;
        clip-path: polygon(0% 6%, 8% 0%, 22% 4%, 39% 0%, 57% 5%, 74% 0%, 90% 4%, 100% 1%,
          99% 50%, 100% 95%, 86% 100%, 68% 96%, 50% 100%, 31% 96%, 14% 100%, 0% 95%, 1.5% 50%);
      }

      #glow {
        position: absolute;
        left: 400px;
        top: 520px;
        width: 680px;
        height: 520px;
        background: radial-gradient(ellipse at center, rgba(246, 215, 127, 0.55) 0%, rgba(246, 215, 127, 0) 68%);
      }
      #n666 {
        position: absolute;
        left: 430px;
        top: 540px;
        width: 620px;
        height: 420px;
        overflow: visible;
      }
      #n666 text {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 700;
        font-size: 330px;
        fill: #8b2e1f;
        stroke: #f6d77f;
        stroke-width: 6;
        stroke-dasharray: 1400;
        paint-order: stroke;
      }

      #quote-wrap { top: 150px; }
      .quote {
        margin: 0;
        font-style: italic;
        font-size: 64px;
        font-weight: 500;
        line-height: 1.14;
      }
      .ref {
        display: block;
        margin-top: 22px;
        font-family: "EB Garamond", Georgia, serif;
        font-size: 28px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #8b5e34;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <div id="camera">
        <img id="bg" src="assets/decor-patmos.jpg" />
        <img id="paper" src="assets/parchemin.jpg" />
        <div id="vignette"></div>
        <div id="motes">
        <i class="mote" style="left:40px;top:100px;width:3px;height:3px;opacity:0.25"></i>
        <i class="mote" style="left:177px;top:363px;width:5px;height:5px;opacity:0.33"></i>
        <i class="mote" style="left:314px;top:626px;width:7px;height:7px;opacity:0.41"></i>
        <i class="mote" style="left:451px;top:889px;width:4px;height:4px;opacity:0.49"></i>
        <i class="mote" style="left:588px;top:1152px;width:6px;height:6px;opacity:0.57"></i>
        <i class="mote" style="left:725px;top:1415px;width:3px;height:3px;opacity:0.25"></i>
        <i class="mote" style="left:862px;top:1678px;width:5px;height:5px;opacity:0.33"></i>
        <i class="mote" style="left:999px;top:241px;width:7px;height:7px;opacity:0.41"></i>
        <i class="mote" style="left:136px;top:504px;width:4px;height:4px;opacity:0.49"></i>
        <i class="mote" style="left:273px;top:767px;width:6px;height:6px;opacity:0.57"></i>
        <i class="mote" style="left:410px;top:1030px;width:3px;height:3px;opacity:0.25"></i>
        <i class="mote" style="left:547px;top:1293px;width:5px;height:5px;opacity:0.33"></i>
        <i class="mote" style="left:684px;top:1556px;width:7px;height:7px;opacity:0.41"></i>
        <i class="mote" style="left:821px;top:119px;width:4px;height:4px;opacity:0.49"></i>
        <i class="mote" style="left:958px;top:382px;width:6px;height:6px;opacity:0.57"></i>
        <i class="mote" style="left:95px;top:645px;width:3px;height:3px;opacity:0.25"></i>
        <i class="mote" style="left:232px;top:908px;width:5px;height:5px;opacity:0.33"></i>
        <i class="mote" style="left:369px;top:1171px;width:7px;height:7px;opacity:0.41"></i>
        </div>
      </div>

      <div class="clip card-wrap" id="hook" data-start="0" data-duration="3.5" style="top: 330px">
        <div class="card hook-card">
          <span class="kicker hook-kicker">Apocalypse 13</span>
          <span class="rule hook-rule"></span>
          <p class="big"><span class="w hw">Un</span> <span class="w hw">nombre</span> <span class="w hw">peut-il</span> <span class="w hw">cacher</span> <span class="w hw">le</span> <span class="w hw accent">nom</span> <span class="w hw">d'un</span> <span class="w hw">homme&nbsp;?</span></p>
        </div>
      </div>

      <img class="clip" id="jean" src="assets/jean-patmos.png" data-start="3.2" data-duration="6.8" />

      <p class="clip" id="s2-caption" data-start="3.25" data-duration="4.3">Depuis Patmos, Jean donne une énigme…</p>

      <div class="clip" id="glow" data-start="5.8" data-duration="2.6"></div>
      <svg class="clip" id="n666" data-start="5.8" data-duration="2.6" viewBox="0 0 620 420">
        <text x="310" y="320" text-anchor="middle">666</text>
      </svg>

      <div class="clip card-wrap" id="quote-wrap" data-start="8.1" data-duration="1.9">
        <div class="card quote-card">
          <p class="quote">« Que celui qui a de l'intelligence calcule ce&nbsp;nombre. »</p>
          <span class="ref">Apocalypse 13.18</span>
        </div>
      </div>

      <div id="grain-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100">
        <div class="grain-texture"></div>
      </div>

      <audio id="voix" src="assets/voix-10s.wav" data-start="0" data-duration="10"></audio>
    </div>

    <style>
      @keyframes hf-grain-noise {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5%, -5%); }
        20% { transform: translate(-10%, 5%); }
        30% { transform: translate(5%, -10%); }
        40% { transform: translate(-5%, 15%); }
        50% { transform: translate(-10%, 5%); }
        60% { transform: translate(15%, 0); }
        70% { transform: translate(0, 10%); }
        80% { transform: translate(-15%, 0); }
        90% { transform: translate(10%, 5%); }
      }
      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.12;
        animation: hf-grain-noise 0.5s steps(1) infinite;
      }
    </style>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera: slow push-in with a slight upward drift for the whole shot.
      tl.fromTo("#camera", { scale: 1.06, y: 0 }, { scale: 1.16, y: -30, duration: 10, ease: "none" }, 0);

      // Dust motes rise slowly; each drift is derived from its index, so frames are deterministic.
      gsap.utils.toArray(".mote").forEach((m, i) => {
        tl.fromTo(m, { y: 0, x: 0 }, { y: -120 - (i % 4) * 40, x: ((i % 3) - 1) * 30, duration: 10, ease: "none" }, 0);
      });

      // Scene 1: the card lands, the rule draws, the words arrive one by one.
      tl.fromTo(".hook-card", { opacity: 0, y: 40, rotation: -3 }, { opacity: 1, y: 0, rotation: -1.5, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo(".hook-kicker", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.35);
      tl.fromTo(".hook-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.4);
      tl.fromTo(".hw", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.24 }, 0.55);
      tl.fromTo(".accent", { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 1.95);
      tl.to(".hook-card", { opacity: 0, y: -60, rotation: -3, duration: 0.45, ease: "power2.in" }, 3.0);

      // Scene 2: Jean rises into frame, caption fades over the sky.
      tl.fromTo("#jean", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" }, 3.2);
      tl.fromTo("#s2-caption", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.4);
      tl.to("#s2-caption", { opacity: 0, duration: 0.4 }, 7.2);

      // 666: glow blooms, the outline draws, then the gold fill lands with a small punch.
      tl.fromTo("#glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 5.8);
      tl.fromTo("#n666 text", { strokeDashoffset: 1400, fillOpacity: 0 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 5.85);
      tl.to("#n666 text", { fillOpacity: 1, duration: 0.4, ease: "power1.out" }, 6.55);
      tl.fromTo("#n666", { scale: 0.92 }, { scale: 1, duration: 0.5, ease: "back.out(2)", transformOrigin: "50% 60%" }, 6.55);
      tl.to(["#n666", "#glow"], { opacity: 0, y: -40, duration: 0.5, ease: "power2.in" }, 7.8);

      // Scene 3: the verse card.
      tl.fromTo(".quote-card", { opacity: 0, y: 40, rotation: 2.5 }, { opacity: 1, y: 0, rotation: 1, duration: 0.7, ease: "power3.out" }, 8.15);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
